<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - eBay/Etsy Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl w-full max-w-md p-8 border border-white/20">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-400 to-blue-600 rounded-xl mx-auto flex items-center justify-center mb-4 shadow-lg">
                <i class="fas fa-store text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-1">eBay/Etsy Manager</h1>
            <p class="text-blue-200 text-sm">Multi-Platform E-Commerce Dashboard</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-blue-100 text-sm font-medium mb-1">Email Address</label>
                <div class="relative">
                    <i class="fas fa-envelope absolute left-3 top-3 text-gray-400"></i>
                    <input type="email" id="login-email" required 
                        class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-white/90 border-0 focus:ring-2 focus:ring-blue-400 text-gray-800 placeholder-gray-400"
                        placeholder="Enter your email">
                </div>
            </div>

            <div>
                <label class="block text-blue-100 text-sm font-medium mb-1">Password</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>
                    <input type="password" id="login-password" required 
                        class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-white/90 border-0 focus:ring-2 focus:ring-blue-400 text-gray-800 placeholder-gray-400"
                        placeholder="Enter your password">
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-blue-200">
                    <input type="checkbox" class="mr-2 rounded border-gray-300">
                    Remember me
                </label>
                <a href="#" class="text-blue-300 hover:text-white transition">Forgot password?</a>
            </div>

            <button type="submit" 
                class="w-full py-2.5 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-semibold rounded-lg shadow-lg transition transform hover:scale-[1.02]">
                Sign In
            </button>
        </form>

        <div class="mt-6 p-4 bg-white/5 rounded-lg border border-white/10">
            <p class="text-blue-200 text-xs text-center mb-2 font-semibold">Demo Credentials</p>
            <div class="space-y-1 text-xs text-blue-100">
                <div class="flex justify-between"><span>Admin:</span> <span class="font-mono">admin@manager.com / admin123</span></div>
                <div class="flex justify-between"><span>Manager:</span> <span class="font-mono">manager@manager.com / manager123</span></div>
                <div class="flex justify-between"><span>Viewer:</span> <span class="font-mono">viewer@manager.com / viewer123</span></div>
            </div>
        </div>
    </div>

    <script src="js/data-store.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const user = DB.getUserByEmail(email);
            if (user && user.password === password) {
                setCurrentUser(user);
                window.location.href = 'index.html';
            } else {
                alert('Invalid email or password!');
            }
        });
    </script>
</body>
</html>
