<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Returns - eBay/Etsy Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"></div>
    <aside id="sidebar" class="sidebar fixed left-0 top-0 h-full w-64 text-white z-50 overflow-y-auto">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center"><i class="fas fa-store text-white"></i></div>
                <div><h1 class="font-bold text-lg leading-tight">E-Commerce</h1><p class="text-xs text-gray-400">Manager Pro</p></div>
            </div>
            <nav class="space-y-1">
                <a href="index.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-sm"><i class="fas fa-chart-line w-5"></i> Dashboard</a>
                <a href="orders.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-sm"><i class="fas fa-shopping-cart w-5"></i> Orders</a>
                <a href="listings.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-sm"><i class="fas fa-tags w-5"></i> Listings</a>
                <a href="inventory.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-sm"><i class="fas fa-boxes w-5"></i> Inventory</a>
                <a href="returns.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 text-sm"><i class="fas fa-undo w-5"></i> Returns</a>
                <a href="recycle-bin.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-sm"><i class="fas fa-trash-alt w-5"></i> Recycle Bin</a>
                <div class="admin-only"><a href="users.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-sm"><i class="fas fa-users w-5"></i> Users</a></div>
                <a href="settings.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-sm"><i class="fas fa-cog w-5"></i> Settings</a>
            </nav>
        </div>
        <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-white/10">
            <button id="logout-btn" class="flex items-center gap-3 px-4 py-2 text-sm text-red-400 hover:text-red-300 w-full"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </aside>

    <main class="main-content lg:ml-64 min-h-screen">
        <header class="bg-white shadow-sm sticky top-0 z-30">
            <div class="flex items-center justify-between px-6 py-4">
                <div class="flex items-center gap-4">
                    <button id="sidebar-toggle" class="lg:hidden text-gray-600 hover:text-gray-900"><i class="fas fa-bars text-xl"></i></button>
                    <h2 class="text-xl font-bold text-gray-800">Returns Management</h2>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden md:flex items-center bg-gray-100 rounded-lg px-3 py-2">
                        <i class="fas fa-search text-gray-400 mr-2"></i>
                        <input type="text" id="global-search" placeholder="Search..." class="bg-transparent border-none outline-none text-sm w-64">
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-right hidden sm:block">
                            <p id="user-name" class="text-sm font-semibold text-gray-800">User</p>
                            <p id="user-role" class="text-xs text-gray-500">Role</p>
                        </div>
                        <div id="user-avatar" class="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-600 rounded-full flex items-center justify-center text-white font-bold">U</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="p-6 space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="stat-card bg-white rounded-xl p-6 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center"><i class="fas fa-undo text-red-600 text-xl"></i></div>
                        <div>
                            <h3 class="text-2xl font-bold text-gray-800" id="total-returns">0</h3>
                            <p class="text-sm text-gray-500">Total Returns</p>
                        </div>
                    </div>
                </div>
                <div class="stat-card bg-white rounded-xl p-6 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-yellow-100 rounded-lg flex items-center justify-center"><i class="fas fa-clock text-yellow-600 text-xl"></i></div>
                        <div>
                            <h3 class="text-2xl font-bold text-gray-800" id="pending-returns">0</h3>
                            <p class="text-sm text-gray-500">Pending Returns</p>
                        </div>
                    </div>
                </div>
                <div class="stat-card bg-white rounded-xl p-6 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center"><i class="fas fa-check-circle text-green-600 text-xl"></i></div>
                        <div>
                            <h3 class="text-2xl font-bold text-gray-800" id="refund-total">$0</h3>
                            <p class="text-sm text-gray-500">Total Refunded</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-4">
                <div class="flex flex-col md:flex-row gap-4 justify-between items-start md:items-center">
                    <div class="flex flex-wrap gap-3 flex-1">
                        <input type="text" id="return-search" placeholder="Search order ID, SKU, reason..." class="form-input px-4 py-2 rounded-lg text-sm w-full md:w-64">
                        <select id="filter-return-status" class="form-input px-4 py-2 rounded-lg text-sm">
                            <option value="">All Status</option>
                            <option value="pending">Pending</option>
                            <option value="approved">Approved</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </div>
                    <div class="flex gap-2 manager-only">
                        <button onclick="openModal('return-modal')" class="btn-primary px-4 py-2 rounded-lg text-white text-sm font-medium flex items-center gap-2"><i class="fas fa-plus"></i> New Return</button>
                        <button onclick="exportReturns()" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg text-gray-700 text-sm font-medium flex items-center gap-2"><i class="fas fa-download"></i> Export</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="data-table w-full">
                        <thead>
                            <tr><th>ID</th><th>Order ID</th><th>SKU</th><th>Reason</th><th>Refund Amount</th><th>Status</th><th>Received Date</th><th>Notes</th><th class="admin-only">Actions</th></tr>
                        </thead>
                        <tbody id="returns-table-body"></tbody>
                    </table>
                </div>
                <div id="returns-pagination"></div>
            </div>
        </div>
    </main>

    <div id="return-modal" class="modal-overlay fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="modal-content bg-white rounded-xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between rounded-t-xl">
                <h3 class="text-lg font-bold text-gray-800" id="return-modal-title">New Return</h3>
                <button onclick="closeModal('return-modal')" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="return-form" class="p-6 space-y-4">
                <input type="hidden" id="return-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Order ID *</label>
                    <select id="return-order-id" required class="form-input w-full px-4 py-2 rounded-lg">
                        <option value="">Select Order</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">SKU</label>
                    <input type="text" id="return-sku" class="form-input w-full px-4 py-2 rounded-lg font-mono bg-gray-50" readonly>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Reason *</label>
                    <textarea id="return-reason" required rows="3" class="form-input w-full px-4 py-2 rounded-lg" placeholder="Why is this being returned?"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Refund Amount *</label>
                        <input type="number" id="return-refund" required step="0.01" min="0" class="form-input w-full px-4 py-2 rounded-lg" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                        <select id="return-status" class="form-input w-full px-4 py-2 rounded-lg">
                            <option value="pending">Pending</option>
                            <option value="approved">Approved</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Received Date</label>
                    <input type="date" id="return-received" class="form-input w-full px-4 py-2 rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                    <textarea id="return-notes" rows="2" class="form-input w-full px-4 py-2 rounded-lg" placeholder="Additional notes..."></textarea>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="btn-primary flex-1 py-2.5 rounded-lg text-white font-medium">Save Return</button>
                    <button type="button" onclick="closeModal('return-modal')" class="flex-1 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/data-store.js"></script>
    <script src="js/app.js"></script>
    <script src="js/returns.js"></script>
</body>
</html>
